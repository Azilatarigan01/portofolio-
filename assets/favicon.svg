<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#skyGrad)" filter="url(#subtleShadow)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="1.5"/>

  <!-- Monogram AZ -->
  <text x="32" y="42" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="-1" 
        fill="#FFFFFF" 
        text-anchor="middle">AZ</text>

  <!-- Accent Sparkle -->
  <path d="M48 14 L50 20 L56 22 L50 24 L48 30 L46 24 L40 22 L46 20 Z" fill="#FDE047" opacity="0.95"/>
</svg>
